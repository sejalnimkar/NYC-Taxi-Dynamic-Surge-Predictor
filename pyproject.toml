[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["spark: needs a local Spark session (and Java)"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["notebooks", "nyc_surge_predictor"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["evaluate", "features", "ingest", "load", "make_fixture"]
