services:
  spark-master:
    image: apache/spark:4.0.2-scala2.13-java17-python3-r-ubuntu
    container_name: spark-master
    command: bash -c "/opt/spark/sbin/start-master.sh && tail -f /dev/null"
    ports:
      - "9090:8080"
      - "7077:7077"
    environment:
      - SPARK_MODE=master
    volumes:
      - .:/home/jovyan/work

  spark-worker:
    image: apache/spark:4.0.2-scala2.13-java17-python3-r-ubuntu
    container_name: spark-worker
    user: root                    # ← add this line
    command: bash -c "/opt/spark/sbin/start-worker.sh spark://spark-master:7077 && tail -f /dev/null"
    depends_on:
      - spark-master
    environment:
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=3G
      - SPARK_WORKER_CORES=1
    volumes:
      - .:/home/jovyan/work

  jupyter:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: jupyter-notebook
    user: root
    ports:
      - "8888:8888"
    environment:
      - SNOWFLAKE_ACCOUNT=${SNOWFLAKE_ACCOUNT}
      - SNOWFLAKE_USER=${SNOWFLAKE_USER}
      - SNOWFLAKE_PASSWORD=${SNOWFLAKE_PASSWORD}
      - SNOWFLAKE_WAREHOUSE=${SNOWFLAKE_WAREHOUSE}
    volumes:
      - .:/home/jovyan/work
    depends_on:
      - spark-master
    command: bash -c "pip install notebook && python3 -m notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root"

  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow.Dockerfile
    container_name: mlflow-server
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////mlruns/mlflow.db --default-artifact-root /mlruns --allowed-hosts "mlflow:5000,localhost:5000,localhost:*"
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns  

  airflow:
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    container_name: airflow
    restart: unless-stopped
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=admin
      - AIRFLOW__CORE__DAGS_FOLDER=/opt/airflow/dags
      # reuse the same Snowflake env-var pattern you already use for dbt
      - SNOWFLAKE_ACCOUNT=${SNOWFLAKE_ACCOUNT}
      - SNOWFLAKE_USER=${SNOWFLAKE_USER}
      - SNOWFLAKE_PASSWORD=${SNOWFLAKE_PASSWORD}
      - SNOWFLAKE_WAREHOUSE=${SNOWFLAKE_WAREHOUSE}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./dbt:/opt/airflow/dbt          # so BashOperator can `cd` into your dbt project and run dbt commands
      - ./notebooks:/opt/airflow/scripts # wherever your PySpark scripts live
      - airflow_db:/opt/airflow
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8080:8080"
    command: standalone   # runs webserver + scheduler + triggerer in one process — fine for local/dev
    networks:
      - default            # same network as spark-worker, snowflake calls go over internet anyway

volumes:
  airflow_db:       